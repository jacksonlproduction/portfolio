# Netlify: publish only the website itself (build.sh skips the original font files, source photos and notes).
[build]
  command = "sh build.sh"
  publish = "dist"

# Fonts, images and the 3D library rarely change, so browsers can keep them for a while.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
